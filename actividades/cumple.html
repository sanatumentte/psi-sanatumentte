<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz cumpleaños! · Sana tu Mentte</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fraunces:opsz,wght@9..144,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--salvia:#81a9a7;--petroleo:#165a6c;--dorado:#dabb81;--beige:#e7decf;--crema:#f5e8da;--terracota:#c9987c;--texto:#2d4a52}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--texto);overflow-x:hidden;
  background:radial-gradient(ellipse at 15% 10%,#cfe0dc 0,transparent 45%),radial-gradient(ellipse at 90% 85%,#f0d8c4 0,transparent 45%),radial-gradient(ellipse at 85% 15%,#efe2c6 0,transparent 40%),#f7efe4}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.escena{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 40px;text-align:center}
.logo{width:120px;height:auto;margin-bottom:6px;mix-blend-mode:multiply}
.oculto{display:none!important}

/* 1 · Sobre */
#sobre{cursor:pointer;user-select:none}
.regalo{width:190px;height:190px;position:relative;margin:26px auto 18px;animation:salto 1.6s ease-in-out infinite}
.regalo .caja{position:absolute;bottom:0;left:15px;width:160px;height:120px;background:#c89b6d;border-radius:8px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.regalo .tapa{position:absolute;bottom:112px;left:5px;width:180px;height:38px;background:#d4a878;border-radius:8px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.regalo .cinta-v{position:absolute;bottom:0;left:83px;width:24px;height:150px;background:var(--petroleo)}
.regalo .lazo{position:absolute;bottom:146px;left:58px;width:74px;height:40px}
.regalo .lazo:before,.regalo .lazo:after{content:"";position:absolute;top:0;width:36px;height:34px;border:9px solid var(--petroleo);border-radius:50% 50% 50% 0}
.regalo .lazo:before{left:0;transform:rotate(-20deg)}.regalo .lazo:after{right:0;transform:scaleX(-1) rotate(-20deg)}
#sobre.abierto .tapa,#sobre.abierto .lazo,#sobre.abierto .cinta-v{transform:translateY(-60px) rotate(-14deg);opacity:0;transition:all .6s}
@keyframes salto{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(3deg)}}
.titulo{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--petroleo);font-size:clamp(24px,6vw,34px);line-height:1.2}
.sub{font-size:17px;margin-top:8px;color:#4f6b70}
.toca{display:inline-block;margin-top:18px;background:var(--petroleo);color:#fff;font-weight:700;padding:13px 26px;border-radius:999px;font-size:17px;box-shadow:0 6px 18px rgba(22,90,108,.25);border:0;cursor:pointer;font-family:inherit}

/* 2 · Torta */
#fiesta{animation:aparece .7s ease both}
@keyframes aparece{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.feliz{font-family:"Dancing Script",cursive;color:var(--petroleo);font-size:clamp(46px,13vw,78px);line-height:1;margin-top:4px}
.nombre{font-family:"Dancing Script",cursive;color:#b07d3a;font-size:clamp(44px,12vw,72px);line-height:1.1;margin-top:2px;
  background:linear-gradient(90deg,#b07d3a,#dabb81,#b07d3a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 3s linear infinite;padding:0 8px;max-width:100%;overflow-wrap:anywhere}
@keyframes brillo{to{background-position:-200% 0}}
.torta{width:min(440px,94vw);height:auto;margin:14px auto 0;display:block;filter:drop-shadow(0 14px 18px rgba(80,60,40,.18))}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:titila .5s ease-in-out infinite alternate}
.llama:nth-of-type(2n){animation-duration:.42s}
@keyframes titila{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.apagada .llama{animation:apaga .35s forwards}
@keyframes apaga{to{transform:scale(0,.2);opacity:0}}
.humo{opacity:0}
.apagada .humo{animation:humo 1.6s ease-out forwards}
@keyframes humo{0%{opacity:.7;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-40px) scale(1.6)}}
.pista{margin-top:12px;font-size:16px;color:#4f6b70;min-height:24px}
.pista b{color:var(--petroleo)}
#soplarMic{margin-top:8px;background:transparent;border:1.5px solid var(--salvia);color:var(--petroleo);padding:9px 16px;border-radius:999px;font:700 14px Quicksand,sans-serif;cursor:pointer}

/* 3 · Mensaje */
.tarjeta{max-width:460px;margin:22px auto 0;background:#fffaf3;border:1px solid var(--beige);border-radius:22px;padding:24px 22px 20px;
  box-shadow:0 10px 30px rgba(90,70,50,.12);text-align:left;font-size:17px;line-height:1.6;position:relative;animation:aparece .8s ease both}
.tarjeta:before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;margin-left:-48px;background:repeating-linear-gradient(90deg,#81a9a7 0 6px,#9dbdba 6px 12px);opacity:.85;border-radius:3px;transform:rotate(-2deg)}
.tarjeta p{margin-bottom:12px}
.firma{font-family:"Dancing Script",cursive;font-size:30px;color:var(--petroleo);text-align:right;margin-top:4px}
.otra{margin-top:18px;background:transparent;border:0;color:var(--petroleo);font:700 15px Quicksand,sans-serif;text-decoration:underline;cursor:pointer}
.pie{margin-top:26px;font-size:12px;color:#8a9a9a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confeti"></canvas>

<!-- 1 · Regalo -->
<main class="escena" id="sobre" role="button" tabindex="0" aria-label="Abrir sorpresa">
  <img class="logo" src="logo-sana.png" alt="Sana tu Mentte">
  <div class="regalo" aria-hidden="true"><div class="caja"></div><div class="cinta-v"></div><div class="tapa"></div><div class="lazo"></div></div>
  <h1 class="titulo" id="hola">¡Tienes una sorpresa!</h1>
  <p class="sub">Hoy es un día muy especial 🎉</p>
  <button class="toca" type="button">🎁 Toca para abrir</button>
</main>

<!-- 2 · Torta -->
<main class="escena oculto" id="fiesta">
  <img class="logo" src="logo-sana.png" alt="Sana tu Mentte" style="width:96px">
  <div class="feliz">¡Feliz cumpleaños!</div>
  <div class="nombre" id="nombre"></div>

  <svg class="torta" id="torta" viewBox="0 0 320 300" role="img" aria-label="Torta de cumpleaños con velas">
    <defs>
      <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f1e3cf"/></linearGradient>
      <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a9c6c3"/><stop offset="1" stop-color="#81a9a7"/></linearGradient>
      <radialGradient id="luz"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    </defs>
    <!-- plato -->
    <ellipse cx="160" cy="280" rx="150" ry="16" fill="#e7decf"/><ellipse cx="160" cy="276" rx="140" ry="12" fill="#fffaf3"/>
    <!-- piso 1 -->
    <rect x="40" y="196" width="240" height="80" rx="14" fill="url(#g2)"/>
    <path d="M40 210 q15 18 30 0 q15 18 30 0 q15 18 30 0 q15 18 30 0 q15 18 30 0 q15 18 30 0 q15 18 30 0 q15 18 30 0 v-14 h-240z" fill="#fffaf2"/>
    <g fill="#dabb81"><circle cx="70" cy="248" r="5"/><circle cx="110" cy="256" r="5"/><circle cx="150" cy="248" r="5"/><circle cx="190" cy="256" r="5"/><circle cx="230" cy="248" r="5"/><circle cx="262" cy="256" r="4"/></g>
    <!-- piso 2 -->
    <rect x="72" y="126" width="176" height="76" rx="12" fill="url(#g1)"/>
    <path d="M72 138 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 v-12 h-176z" fill="#c9987c"/>
    <path d="M86 176 h148" stroke="#81a9a7" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <!-- flores -->
    <g><circle cx="100" cy="188" r="7" fill="#e8b9b0"/><circle cx="100" cy="188" r="3" fill="#dabb81"/>
       <circle cx="220" cy="188" r="7" fill="#e8b9b0"/><circle cx="220" cy="188" r="3" fill="#dabb81"/>
       <circle cx="160" cy="190" r="8" fill="#165a6c"/><circle cx="160" cy="190" r="3" fill="#dabb81"/></g>
    <!-- velas -->
    <g id="velas">
      <g><rect x="104" y="80" width="12" height="48" rx="3" fill="#fffaf3" stroke="#81a9a7" stroke-width="2"/><path d="M104 92 l12 -6 M104 106 l12 -6 M104 120 l12 -6" stroke="#165a6c" stroke-width="3"/></g>
      <g><rect x="136" y="70" width="12" height="58" rx="3" fill="#fffaf3" stroke="#81a9a7" stroke-width="2"/><path d="M136 82 l12 -6 M136 96 l12 -6 M136 110 l12 -6 M136 124 l12 -6" stroke="#dabb81" stroke-width="3"/></g>
      <g><rect x="172" y="70" width="12" height="58" rx="3" fill="#fffaf3" stroke="#81a9a7" stroke-width="2"/><path d="M172 82 l12 -6 M172 96 l12 -6 M172 110 l12 -6 M172 124 l12 -6" stroke="#165a6c" stroke-width="3"/></g>
      <g><rect x="204" y="80" width="12" height="48" rx="3" fill="#fffaf3" stroke="#81a9a7" stroke-width="2"/><path d="M204 92 l12 -6 M204 106 l12 -6 M204 120 l12 -6" stroke="#dabb81" stroke-width="3"/></g>
    </g>
    <g id="llamas">
      <circle cx="110" cy="64" r="20" fill="url(#luz)" class="llama"/><path class="llama" d="M110 54 c8 10 6 20 0 22 c-6 -2 -8 -12 0 -22z" fill="#f4b23e"/>
      <circle cx="142" cy="54" r="20" fill="url(#luz)" class="llama"/><path class="llama" d="M142 44 c8 10 6 20 0 22 c-6 -2 -8 -12 0 -22z" fill="#f4b23e"/>
      <circle cx="178" cy="54" r="20" fill="url(#luz)" class="llama"/><path class="llama" d="M178 44 c8 10 6 20 0 22 c-6 -2 -8 -12 0 -22z" fill="#f4b23e"/>
      <circle cx="210" cy="64" r="20" fill="url(#luz)" class="llama"/><path class="llama" d="M210 54 c8 10 6 20 0 22 c-6 -2 -8 -12 0 -22z" fill="#f4b23e"/>
    </g>
    <g fill="#c8c2ba"><circle class="humo" cx="110" cy="70" r="6"/><circle class="humo" cx="142" cy="60" r="6"/><circle class="humo" cx="178" cy="60" r="6"/><circle class="humo" cx="210" cy="70" r="6"/></g>
  </svg>

  <section class="tarjeta oculto" id="mensaje" aria-live="polite"></section>
  <p class="pie">Sana tu Mentte · Psi. Camila Salazar Ramírez</p>
</main>

<script>
(function(){
  // Datos: #<base64url {n:nombre,g:h|m,f:1|0}>  (el # nunca viaja al servidor)
  let d={n:'',g:'h',f:1};
  try{ const h=location.hash.slice(1); if(h){ const s=h.replace(/-/g,'+').replace(/_/g,'/'); d=Object.assign(d,JSON.parse(decodeURIComponent(escape(atob(s))))); } }catch(e){}
  const nombre=String(d.n||'').slice(0,40);
  const $=id=>document.getElementById(id);
  if(nombre) $('hola').textContent=`¡${nombre}, tienes una sorpresa!`;
  $('nombre').textContent=nombre;
  if(nombre) document.title=`¡Feliz cumpleaños, ${nombre}!`;

  const MSJ=[
    'Hola '+(nombre||'')+' 🎂✨',
    'Hoy es un día especial y no quería dejarlo pasar sin desearte un muy feliz cumpleaños. Que este nuevo año llegue lleno de cosas buenas: momentos que disfrutes, personas que te quieran bien, sueños que te ilusionen y mucha paz en el corazón.',
    'Celebra todo lo que eres y todo lo que has vivido hasta hoy…'
  ];

  /* ---- Confeti (sin librerías) ---- */
  const cv=$('confeti'), cx=cv.getContext('2d'); let piezas=[], corriendo=false;
  const COL=['#81a9a7','#165a6c','#dabb81','#c9987c','#e8b9b0','#047578','#f4b23e'];
  function tam(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  addEventListener('resize',tam); tam();
  function lanzar(n,origenY){
    const W=innerWidth;
    for(let i=0;i<n;i++){
      const lado=i%2?1:-1;
      piezas.push({x: origenY==null? Math.random()*W : (lado<0? 0 : W), y: origenY==null? -20-Math.random()*innerHeight*.5 : origenY,
        vx: origenY==null? (Math.random()-.5)*2 : -lado*(4+Math.random()*7), vy: origenY==null? 2+Math.random()*3 : -(6+Math.random()*9),
        r:4+Math.random()*6, c:COL[i%COL.length], a:Math.random()*6, va:(Math.random()-.5)*.3, f:Math.random()<.3?'c':'r', vida:0});
    }
    if(!corriendo){ corriendo=true; requestAnimationFrame(paso); }
  }
  function paso(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    piezas.forEach(p=>{ p.vy+=.12; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.vida++;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c;
      if(p.f==='c'){ cx.beginPath(); cx.arc(0,0,p.r*.6,0,7); cx.fill(); } else { cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2*Math.abs(Math.cos(p.vida*.1))+1); }
      cx.restore(); });
    piezas=piezas.filter(p=>p.y<innerHeight+30);
    if(piezas.length) requestAnimationFrame(paso); else { corriendo=false; cx.clearRect(0,0,innerWidth,innerHeight); }
  }

  /* ---- 1 → 2 ---- */
  const sobre=$('sobre');
  function abrir(){ if(sobre.classList.contains('abierto')) return; sobre.classList.add('abierto');
    setTimeout(()=>{ sobre.classList.add('oculto'); $('fiesta').classList.remove('oculto'); lanzar(160, innerHeight*.75); setTimeout(()=>lanzar(200),700); setTimeout(mostrarMensaje,1200); },650); }
  sobre.addEventListener('click',abrir); sobre.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') abrir(); });

  /* ---- Mensaje (sin soplar velas) ---- */
  function mostrarMensaje(){
    const m=$('mensaje'); m.innerHTML=MSJ.map(()=>'<p></p>').join('')+'<div class="firma">Con cariño, tu psicóloga Camila 🫂🫂</div>';
    m.querySelectorAll('p').forEach((p,i)=>p.textContent=MSJ[i]); m.classList.remove('oculto');
  }
})();
</script>
</body>
</html>
