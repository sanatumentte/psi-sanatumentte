<style>
.wa-float{position:fixed;right:18px;bottom:18px;z-index:190;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.wa-float svg{width:30px;height:30px;fill:#fff}
:root{--salvia:#81a9a7;--petroleo:#165a6c;--dorado:#dabb81;--beige:#e7decf;--verde:#047578;--crema:#f5e8da;--terracota:#c9987c;--fondo:#faf4ec;--suave:#46666f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,sans-serif;background:var(--fondo);color:#143f4b;line-height:1.7}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 22px}
header{background:var(--salvia);padding:22px 0 90px;color:#fff;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}
.top a.logo{display:flex;align-items:center;gap:10px;font-family:"Playfair Display",serif;font-size:20px}
.top img{width:42px}
.back{background:#fff;color:var(--petroleo);border-radius:99px;padding:10px 20px;font-size:14px;font-weight:600}
h1{font-family:"Playfair Display",serif;font-weight:400;font-size:clamp(40px,6vw,70px);line-height:1.05}
h1 i{color:var(--petroleo)}
.hand{font-family:"Shadows Into Light Two",cursive;font-size:28px;color:var(--petroleo);display:block;margin-top:10px}
.list{columns:3;column-gap:22px;margin-top:-50px}
.shot{break-inside:avoid;margin-bottom:22px}
.rvw{position:relative;background:#fffdf7;border-radius:24px;padding:26px 24px 20px;box-shadow:0 18px 40px rgba(14,40,48,.16);overflow:hidden}
.rvw-q{position:absolute;right:18px;top:-14px;font-family:"Playfair Display",serif;font-size:120px;line-height:1;color:var(--dorado);opacity:.35;pointer-events:none}
.rvw-st{color:var(--dorado);font-size:17px;letter-spacing:3px;margin-bottom:10px}
.rvw h3{font-family:"Playfair Display",serif;font-weight:400;font-style:italic;font-size:22px;line-height:1.25;color:var(--petroleo);margin-bottom:12px;padding-right:20px}
.rvw-body{font-size:14.5px;line-height:1.6;color:var(--suave);max-height:7.9em;overflow:hidden;position:relative;transition:max-height .5s}
.rvw-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,#fffdf7);transition:opacity .3s}
.rvw.open .rvw-body{max-height:80em}.rvw.open .rvw-body::after{opacity:0}
.rvw-body p+p{margin-top:9px}
.rvw-more{border:0;background:none;color:var(--verde);font:600 13px Montserrat,system-ui,sans-serif;padding:8px 0 0;cursor:pointer;border-bottom:1px solid currentColor}
.rvw-ft{display:flex;align-items:center;gap:11px;margin-top:16px;padding-top:14px;border-top:1px solid var(--beige);flex-wrap:wrap}
.rvw-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--salvia);color:#fff;font-family:"Playfair Display",serif;font-size:17px}
.rvw-ft b{display:block;font-size:14px;color:var(--petroleo)}
.rvw-ft small{font-size:12px;color:var(--suave)}
.rvw-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.rvw-tags em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--petroleo);background:rgba(129,169,167,.2);padding:5px 10px;border-radius:99px}
.card{break-inside:avoid;background:#fff;border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:0 16px 36px rgba(22,90,108,.08)}
.card .st{color:var(--dorado);letter-spacing:3px;font-size:18px}
.card p{font-family:"Playfair Display",serif;font-style:italic;font-size:18px;line-height:1.5;margin:10px 0 14px;color:var(--petroleo)}
.card small{font-size:13px;color:var(--suave);font-weight:600}
.empty{text-align:center;color:var(--suave);background:#fff;border-radius:22px;padding:40px}
.form{background:var(--petroleo);color:#fff;border-radius:32px;padding:54px;margin:70px auto 90px;max-width:760px;scroll-margin-top:30px}
.form h2{font-family:"Playfair Display",serif;font-weight:400;font-size:40px;line-height:1.1}
.form h2 i{color:var(--crema)}
.form>p{opacity:.85;margin:8px 0 26px}
label{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;margin:16px 0 6px}
input[type=text],textarea{width:100%;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-size:15px;color:#143f4b;background:var(--crema)}
textarea{min-height:140px;resize:vertical}
.stars{display:flex;gap:6px;font-size:34px;cursor:pointer;color:rgba(255,255,255,.35)}
.stars span.on{color:var(--dorado)}
.ok{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;opacity:.9;margin-top:16px}
.btn:disabled{opacity:.6;cursor:wait}
.btn{margin-top:24px;display:inline-flex;background:var(--crema);color:var(--petroleo);border:0;border-radius:99px;padding:15px 30px;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--dorado);font-size:14px;margin-top:10px;min-height:20px}
.note{font-size:12.5px;opacity:.75;margin-top:16px}
@media(max-width:900px){.list{columns:2}}
@media(max-width:600px){.list{columns:1}.form{padding:34px 24px}.top{margin-bottom:36px}}

<body>
<header>
  <div class="w">
    <div class="top"><a class="logo" href="index.html"><img src="img/logo.png" alt="">Sana tu Mentte</a><a class="back" href="index.html#testimonios">← Volver</a></div>
    <h1>Reseñas de <i>pacientes</i></h1>
    <span class="hand">historias reales de procesos reales ♡</span>
  </div>
</header>
<main class="w">
  <div class="list" id="list"></div>
  <section class="form" id="escribir">
    <h2>Deja tu <i>reseña</i></h2>
    <p>¿Fuiste parte de un proceso conmigo? Tu experiencia puede animar a alguien a dar el primer paso.</p>
    <label for="rvName">Nombre o iniciales (como quieres que aparezca)</label>
    <input type="text" id="rvName" placeholder="Ej.: M. G. o Paciente">
    <label>Calificación</label>
    <div class="stars" id="rvStars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <label for="rvText">Tu experiencia</label>
    <textarea id="rvText" placeholder="Cuéntanos cómo fue tu proceso…"></textarea>
    <label class="ok"><input type="checkbox" id="rvOk"> Autorizo que esta reseña se publique en la página, sin mi nombre completo.</label>
    <input type="text" id="rvWeb" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <button class="btn" id="rvSend">Enviar reseña →</button>
    <div class="err" id="rvErr"></div>
    <p class="note" id="rvNote">Tu reseña se publicará en esta página. Por tu privacidad, usa solo tu nombre o tus iniciales.</p>
  </section>
</main>
<script src="resenas-diseno.js?v=1"></script>
<script>
if(!RESENAS_URL)document.getElementById('rvNote').textContent='Se abrirá WhatsApp con tu reseña lista para enviar.';
let val=0;const st=[...document.querySelectorAll('#rvStars span')];
st.forEach((s,i)=>s.onclick=()=>{val=i+1;st.forEach((x,k)=>x.classList.toggle('on',k<val))});
const L=document.getElementById('list');
function tarjeta(r,arriba){const d=tarjetaResena(disenoResena(r));arriba?L.prepend(d):L.appendChild(d);requestAnimationFrame(d.ajustar)}
const vacio=document.createElement('p');vacio.className='empty';
document.getElementById('rvSend').onclick=async()=>{
  const btn=document.getElementById('rvSend'),n=document.getElementById('rvName').value.trim(),t=document.getElementById('rvText').value.trim(),e=document.getElementById('rvErr');
  if(!val){e.textContent='Elige una calificación.';return}
  if(t.length<10){e.textContent='Escribe un poco más sobre tu experiencia.';return}
  if(!document.getElementById('rvOk').checked){e.textContent='Marca la autorización para poder publicarla.';return}
  e.textContent='';
  if(!RESENAS_URL){
    const msg='Hola Camila, te dejo mi reseña para la página web:\n\n'+'★'.repeat(val)+'\n"'+t+'"\n— '+(n||'Paciente')+'\n\nAutorizo publicarla sin mi nombre completo.';
    window.open('https://wa.me/message/CVCEFMEVO3MYM1?text='+encodeURIComponent(msg),'_blank');return;
  }
  btn.disabled=true;btn.textContent='Publicando…';
  try{
    await fetch(RESENAS_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({nombre:n||'Paciente',estrellas:val,texto:t,web:document.getElementById('rvWeb').value})});
    vacio.remove();
    const hoy=new Date();tarjeta({nombre:n||'Paciente',estrellas:val,texto:t,fecha:hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')},true);
    document.getElementById('escribir').innerHTML='<h2>¡Gracias por tu <i>reseña!</i></h2><p>Ya está publicada. Tu experiencia puede animar a alguien a dar el primer paso. ♡</p>';
    L.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    btn.disabled=false;btn.textContent='Enviar reseña →';e.textContent='No se pudo enviar. Revisa tu conexión e intenta de nuevo.';
  }
};
Promise.all([
  cargarResenas(),
  fetch('resenas.json').then(r=>r.json()).catch(()=>[])
]).then(([nuevas,fijas])=>{
  const a=[...(Array.isArray(nuevas)?nuevas:[]),...fijas];
  if(!a.length){vacio.textContent='Aún no hay reseñas publicadas. ¡Sé la primera persona!';L.before(vacio);return}
  a.forEach(r=>tarjeta(r));
});
</script>
